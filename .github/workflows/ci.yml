name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore Aganox.Rental.sln

      - name: Build
        run: dotnet build Aganox.Rental.sln -c Release --no-restore

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/aganox-rental-web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: src/aganox-rental-web/package-lock.json

      - run: npm ci

      - run: npm run build
